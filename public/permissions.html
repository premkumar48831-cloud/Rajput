<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Permission Tracker - User Website</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 500px;
      width: 100%;
    }
    
    h1 {
      color: #333;
      text-align: center;
      margin-bottom: 30px;
      font-size: 28px;
    }
    
    .permission-card {
      background: #f8f9fa;
      border: 2px solid #e9ecef;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }
    
    .permission-card:hover {
      border-color: #667eea;
      transform: translateY(-2px);
    }
    
    .permission-card h3 {
      color: #495057;
      margin-bottom: 15px;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .icon {
      font-size: 24px;
    }
    
    button {
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 10px;
    }
    
    .btn-camera {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .btn-mic {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
    }
    
    .btn-location {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      color: white;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    
    button:active {
      transform: translateY(0);
    }
    
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    .status {
      text-align: center;
      padding: 10px;
      border-radius: 6px;
      margin-top: 10px;
      font-weight: 600;
      display: none;
    }
    
    .status.granted {
      background: #d4edda;
      color: #155724;
      display: block;
    }
    
    .status.denied {
      background: #f8d7da;
      color: #721c24;
      display: block;
    }
    
    .status.prompt {
      background: #fff3cd;
      color: #856404;
      display: block;
    }
    
    .info-box {
      background: #e7f3ff;
      border-left: 4px solid #2196F3;
      padding: 15px;
      margin-top: 25px;
      border-radius: 6px;
      font-size: 14px;
      color: #555;
    }
    
    .info-box p {
      margin-bottom: 8px;
    }
    
    .user-id-display {
      background: #f1f3f5;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      margin-top: 20px;
      font-family: monospace;
      font-size: 13px;
      color: #495057;
    }

    .home-link {
      display: block;
      text-align: center;
      margin-top: 15px;
      font-size: 13px;
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }
    .home-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 Permission Access</h1>
    
    <div class="permission-card">
      <h3><span class="icon">📷</span> Camera Access</h3>
      <button class="btn-camera" onclick="requestCamera()">Allow Camera</button>
      <div id="camera-status" class="status"></div>
    </div>
    
    <div class="permission-card">
      <h3><span class="icon">🎤</span> Microphone Access</h3>
      <button class="btn-mic" onclick="requestMicrophone()">Allow Microphone</button>
      <div id="microphone-status" class="status"></div>
    </div>
    
    <div class="permission-card">
      <h3><span class="icon">📍</span> Location Access</h3>
      <button class="btn-location" onclick="requestLocation()">Allow Location</button>
      <div id="location-status" class="status"></div>
    </div>
    
    <div class="info-box">
      <p><strong>ℹ️ Information:</strong></p>
      <p>• Your permission choices are securely tracked</p>
      <p>• This helps us improve your experience</p>
      <p>• All data is encrypted and protected</p>
    </div>
    
    <div class="user-id-display" id="userIdDisplay"></div>
    <a href="/" class="home-link">← Return to VIP Store</a>
  </div>

  <script>
    // ============================================
    // CONFIGURATION - USES CURRENT DOMAIN / BACKEND
    // ============================================
    const BACKEND_URL = window.location.origin || 'http://localhost:3000';
    // ============================================
    
    // Permission status tracking
    let permissionStatus = {
      camera: 'unknown',
      microphone: 'unknown',
      geolocation: 'unknown'
    };

    // Generate or get unique user ID
    function generateUserId() {
      let userId = localStorage.getItem('userId');
      if (!userId) {
        userId = 'user_' + Math.random().toString(36).substr(2, 9) + Date.now().toString(36);
        localStorage.setItem('userId', userId);
      }
      return userId;
    }

    // Display user ID
    function displayUserId() {
      const userId = generateUserId();
      document.getElementById('userIdDisplay').textContent = 'Your ID: ' + userId;
      return userId;
    }

    // Get user IP address
    async function getUserIP() {
      try {
        const response = await fetch('https://api.ipify.org?format=json');
        const data = await response.json();
        return data.ip;
      } catch (error) {
        console.log('Could not get IP address');
        return 'unknown';
      }
    }

    // Check permission status using Permissions API
    async function checkPermission(name) {
      try {
        const result = await navigator.permissions.query({ name: name });
        permissionStatus[name] = result.state;
        updateStatusUI(name, result.state);
        
        // Send to backend
        await sendToBackend(name, result.state);
        
        // Listen for changes
        result.onchange = async () => {
          permissionStatus[name] = result.state;
          updateStatusUI(name, result.state);
          await sendToBackend(name, result.state);
        };
        
        return result.state;
      } catch (err) {
        console.log(`${name} permission not supported in this browser`);
        permissionStatus[name] = 'not-supported';
        updateStatusUI(name, 'not-supported');
        return 'not-supported';
      }
    }

    // Update UI with permission status
    function updateStatusUI(permission, status) {
      const statusElement = document.getElementById(`${permission}-status`);
      if (!statusElement) return;
      
      if (status === 'granted') {
        statusElement.textContent = '✓ Permission Granted';
        statusElement.className = 'status granted';
      } else if (status === 'denied') {
        statusElement.textContent = '✗ Permission Denied';
        statusElement.className = 'status denied';
      } else if (status === 'prompt') {
        statusElement.textContent = '⏳ Waiting for permission...';
        statusElement.className = 'status prompt';
      } else if (status === 'not-supported') {
        statusElement.textContent = '⚠ Not supported in your browser';
        statusElement.className = 'status denied';
      }
    }

    // Request camera permission
    async function requestCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        
        // Stop the stream after getting permission
        stream.getTracks().forEach(track => track.stop());
        
        await checkPermission('camera');
      } catch (err) {
        console.log('Camera permission denied or error:', err);
        permissionStatus.camera = 'denied';
        updateStatusUI('camera', 'denied');
        await sendToBackend('camera', 'denied');
      }
    }

    // Request microphone permission
    async function requestMicrophone() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        // Stop the stream after getting permission
        stream.getTracks().forEach(track => track.stop());
        
        await checkPermission('microphone');
      } catch (err) {
        console.log('Microphone permission denied or error:', err);
        permissionStatus.microphone = 'denied';
        updateStatusUI('microphone', 'denied');
        await sendToBackend('microphone', 'denied');
      }
    }

    // Request location permission
    async function requestLocation() {
      if ('geolocation' in navigator) {
        navigator.geolocation.getCurrentPosition(
          async (position) => {
            console.log('Location accessed:', position.coords);
            await checkPermission('geolocation');
          },
          async (error) => {
            console.log('Location permission denied:', error);
            permissionStatus.geolocation = 'denied';
            updateStatusUI('geolocation', 'denied');
            await sendToBackend('geolocation', 'denied');
          },
          {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
          }
        );
      } else {
        console.log('Geolocation not supported');
        permissionStatus.geolocation = 'not-supported';
        updateStatusUI('geolocation', 'not-supported');
      }
    }

    // Send permission data to backend
    async function sendToBackend(permission, status) {
      const userId = generateUserId();
      const userIP = await getUserIP();
      
      const data = {
        userId: userId,
        permission: permission,
        status: status,
        timestamp: new Date().toISOString(),
        userAgent: navigator.userAgent,
        ip: userIP,
        platform: navigator.platform,
        language: navigator.language
      };

      try {
        const response = await fetch(`${BACKEND_URL}/api/track-permission`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(data)
        });
        
        if (response.ok) {
          console.log(`✓ ${permission} permission data sent successfully`);
        } else {
          console.error(`Failed to send ${permission} data:`, response.status);
        }
      } catch (error) {
        console.error(`Error sending ${permission} data:`, error);
      }
    }

    // Initialize on page load
    window.onload = async () => {
      displayUserId();
      
      // Check all permissions on load
      await checkPermission('camera');
      await checkPermission('microphone');
      await checkPermission('geolocation');
      
      console.log('Permission tracker initialized');
    };

    // Log when user leaves the page
    window.onbeforeunload = () => {
      console.log('User leaving page...');
    };
  </script>
</body>
</html>
