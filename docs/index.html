    <script>
      // Single Page Apps for GitHub Pages
      // Decodes and restores URLs redirected from 404.html
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));

      // Suppress harmless Vite dev HMR websocket warning in iframe container
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason ? (event.reason.message || String(event.reason)) : '';
        if (reason.indexOf('WebSocket') !== -1 || reason.indexOf('websocket') !== -1) {
          event.preventDefault();
        }
      });
    </script>
