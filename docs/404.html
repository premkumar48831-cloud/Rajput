<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FFH4X VIP Store - Redirecting...</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Redirects 404 paths back to the index.html SPA
      var l = window.location;
      // If deployed on <username>.github.io/<repo>/, keep 1 segment (the repo name)
      // If deployed on custom domain or root, keep 0 segments
      var isGitHubPages = l.hostname.indexOf('github.io') !== -1;
      var pathSegmentsToKeep = isGitHubPages ? 1 : 0;
      var repoPrefix = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');

      try {
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          repoPrefix + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      } catch (e) {
        window.location.href = repoPrefix + '/';
      }
    </script>
  </head>
  <body style="background:#080b11;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
    <div style="text-align:center;">
      <h2>Loading FFH4X Store...</h2>
      <p>Redirecting to store...</p>
    </div>
  </body>
</html>
