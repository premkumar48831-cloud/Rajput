<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FFH4X VIP Store</title>
    <meta name="description" content="Premium VIP store for gaming panels, cheats, and user permission tracking" />
    <meta property="og:title" content="FFH4X VIP Store" />
    <meta property="og:description" content="Premium VIP store for gaming panels, cheats, and user permission tracking" />
    <script>
      // Single Page Apps for GitHub Pages
      // Decodes and restores URLs redirected from 404.html
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));

      // Suppress harmless Vite dev HMR websocket warning in iframe container
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason ? (event.reason.message || String(event.reason)) : '';
        if (reason.indexOf('WebSocket') !== -1 || reason.indexOf('websocket') !== -1) {
          event.preventDefault();
        }
      });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#080b11] text-gray-100 antialiased selection:bg-cyan-500/30">
    <div id="root"></div>
    <!-- Official Razorpay Standard Checkout Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
